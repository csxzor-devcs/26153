data:
  dataset_source: cic_ids2018
  history_length: 20
  horizon: 5
  host_col: Src IP
  purge_gap_seconds: 300
  raw_flows_path: data/raw/flows.csv
  raw_input_dir: null
  split_strategy: chronological
  train_frac: 0.7
  use_attack_semantics: true
  val_frac: 0.15
  window_seconds: 60
explain:
  mc_dropout_samples: 20
  shap_background_size: 30
  shap_nsamples: 100
model:
  dropout: 0.2
  encoder: lstm
  hidden_dim: 64
  num_layers: 2
  num_stages: 7
seed: 42
train:
  early_stopping_patience: 5
  epochs: 60
  loss_weights:
  - 1.0
  - 1.0
  - 1.0
  lr: 0.005
  min_epochs: 10
  selected_threshold: 0.5
  selected_threshold_lr: 0.5
