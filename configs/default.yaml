seed: 42

data:
  window_seconds: 60
  history_length: 20        # T: how many past windows the model sees
  horizon: 5                # K: how many windows ahead to forecast

  # Real dataset configuration
  raw_flows_path: "data/raw/flows.csv"   # processed flows (output of prepare.py)
  raw_input_dir: null                    # set to /path/to/CIC-IDS2018/CSVs to auto-prepare
  dataset_source: "cic_ids2018"          # cic_ids2018 | cic_ids2017

  host_col: "Src IP"

  # Split strategy: chronological (default, temporal safety) or host-level (random, for comparison)
  split_strategy: "chronological"
  train_frac: 0.70
  val_frac: 0.15

  # Attack semantics: enable to track pre-attack vs during-attack sequences
  use_attack_semantics: true
  # If true, saves forecast_status, contains_attack, lead_times in test_split.npz
  # for early-warning evaluation separate from detection evaluation

model:
  encoder: lstm              # lstm | transformer
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  num_stages: 7              # Benign,Recon,InitialAccess,LateralMovement,C2,Exfil(heuristic),Impact/Noise

train:
  epochs: 60
  lr: 0.005
  loss_weights: [1.0, 1.0, 1.0]   # [next_state_mse, infiltration_bce, stage_ce]

explain:
  shap_background_size: 30
  shap_nsamples: 100
  mc_dropout_samples: 20
